<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Campus Assistant</title>
  <style>
    :root {
      --bg: #000000;
      --text: #f4f4f4;
      --muted: rgba(255,255,255,0.75);
      --panel: rgba(255,255,255,0.08);
      --panel-strong: rgba(255,255,255,0.12);
      --blue-start: #2f9aff;
      --blue-end: #1d71d7;
      --chip: rgba(255,255,255,0.08);
      --shadow: 0 18px 38px rgba(0,0,0,0.38);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .page-shell {
      width: min(100%, 980px);
      margin: 0 auto;
      text-align: center;
    }

    .title-badge {
      display: inline-block;
      background: rgba(62, 146, 255, 0.10);
      border: none;
      color: #8ec3ff;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: clamp(0.62rem, 0.9vw, 0.9rem);
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(67, 143, 255, 0.12);
      text-shadow: 0 0 8px rgba(120, 182, 255, 0.25);
    }

    .welcome {
      margin-top: 30px;
      font-size: clamp(2.8rem, 5vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1.05;
    }

    .welcome .emoji {
      font-size: 0.92em;
    }

    .subtitle {
      margin-top: 10px;
      font-size: clamp(1.7rem, 3vw, 3rem);
      color: rgba(255,255,255,0.82);
      font-weight: 300;
      letter-spacing: -0.03em;
    }

    .assistant-panel {
      width: min(100%, 860px);
      margin: 34px auto 0;
      background: rgba(255,255,255,0.08);
      border-radius: 26px;
      padding: 28px 30px;
      box-shadow: var(--shadow);
      text-align: left;
    }

    .assistant-header {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 700;
      margin-bottom: 18px;
    }

    .bot-icon {
      width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      font-size: 1.3em;
    }

    .assistant-message {
      font-size: clamp(1.9rem, 2.8vw, 3rem);
      color: rgba(255,255,255,0.95);
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .prompt-box {
      width: min(100%, 860px);
      margin: 26px auto 0;
      background: rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 22px 26px;
      text-align: left;
      color: rgba(255,255,255,0.72);
      font-size: clamp(1.5rem, 2.6vw, 2.7rem);
      font-weight: 400;
    }

    .quick-actions {
      width: min(100%, 860px);
      margin: 28px auto 0;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .chip {
      flex: 1 1 200px;
      min-width: 180px;
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 22px;
      color: var(--text);
      padding: 18px 20px;
      font-size: clamp(1.4rem, 2vw, 2.1rem);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .chip:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    .chip .emoji {
      font-size: 1.3em;
    }

    @media (max-width: 760px) {
      body { padding: 18px 14px; }
      .title-badge { padding: 12px 22px; }
      .assistant-panel, .prompt-box, .quick-actions { width: 100%; }
      .assistant-header { font-size: 2.2rem; }
      .assistant-message { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="title-badge">AI CAMPUS ASSISTANT</div>

    <h1 class="welcome">Hello, Student 👍  <span class="emoji">??</span></h1>

    <p class="subtitle">Your smart campus companion</p>

    <div class="assistant-panel">
      <div class="assistant-header">
        <span class="bot-icon">🤦‍♂️</span>
        <span>Campus AI</span>
      </div>

      <div class="assistant-message">Hi! How can I help you today?</div>
    </div>

    <div class="prompt-box">Ask anything about your campus...</div>

    <div class="quick-actions">
      <button class="chip"><span class="emoji">??</span>Academic</button>
      <button class="chip"><span class="emoji">??</span>Campus Info</button>
      <button class="chip"><span class="emoji">??</span>Events</button>
    </div>
  </div>
</body>
</html>
